version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"   # web interface
      - "7687:7687"   # bolt (driver)
    environment:
      - NEO4J_AUTH=neo4j/test1234
    volumes:
      - neo4j-data:/data

volumes:
  mongo-data:
  neo4j-data: